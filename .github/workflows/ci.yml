name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Stress test (20 runs, up to 30 threads)
        run: make test
      - name: ThreadSanitizer run
        run: make tsan
